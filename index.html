<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>우주의 나이 탐구</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #080d22;
      color: white;
      font-family:
        "Malgun Gothic",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      color: #f0d082;
    }

    p {
      line-height: 1.7;
      color: #c8cdea;
    }

    .card {
      margin-top: 30px;
      padding: 24px;
      background-color: #131b41;
      border: 1px solid #2a3468;
      border-radius: 16px;
    }

    button {
      padding: 12px 20px;
      background-color: #57d9a3;
      color: #08210f;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>우주의 나이를 밝혀라</h1>

    <p>
      실제 천문학 데이터를 활용하여
      우주의 나이를 추정하는 탐구 활동입니다.
    </p>

    <section class="card">
      <h2>예측하기</h2>

      <p>
        우주의 나이는 약 몇 억 년일까요?
        자료를 분석하기 전에 먼저 예상해 봅시다.
      </p>

      <button type="button">
        탐구 시작
      </button>
    </section>
  </main>
</body>
</html>
