<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>우주의 나이 탐구</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background-color: #080d22;
      color: white;
      font-family:
        "Malgun Gothic",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    h1 {
      color: #f0d082;
    }

    p {
      line-height: 1.7;
      color: #c8cdea;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      margin-top: 30px;
      padding: 24px;
      background-color: #131b41;
      border: 1px solid #2a3468;
      border-radius: 16px;
    }

    button {
      padding: 12px 20px;
      background-color: #57d9a3;
      color: #08210f;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .settings-button {
      background-color: #f0d082;
      color: #171b34;
    }

    .settings-panel {
      display: none;
      margin-bottom: 24px;
      padding: 20px;
      background-color: #111936;
      border: 1px solid #f0d082;
      border-radius: 16px;
    }

    .settings-panel.open {
      display: block;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #f0d082;
      font-weight: bold;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      background-color: #080d22;
      color: white;
      border: 1px solid #2a3468;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .settings-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .reset-button {
      background-color: #ff8daa;
      color: #31121a;
    }

    .notice {
      display: none;
      margin-top: 12px;
      color: #57d9a3;
      font-weight: bold;
    }

    .age-options {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .age-option {
      padding: 18px;
      background-color: #111936;
      color: white;
      border: 1px solid #2a3468;
      border-radius: 14px;
      text-align: left;
    }

    .age-option strong {
      display: block;
      margin-bottom: 6px;
      color: #f0d082;
      font-size: 21px;
    }

    .age-option span {
      color: #aab3dd;
      font-size: 13px;
    }

    .age-option.selected {
      background-color: #183b49;
      border: 2px solid #5fd2e4;
    }

    .result-box {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background-color: #102e28;
      border-left: 4px solid #57d9a3;
      border-radius: 10px;
      color: #d4f7e9;
    }

    .result-box.show {
      display: block;
    }

    .action-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    .back-button {
      background-color: #2a3468;
      color: white;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 14px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="top-bar">
      <button
        class="settings-button"
        type="button"
        onclick="toggleSettings()"
      >
        ⚙ 교사용 편집
      </button>
    </div>

    <section
      class="settings-panel"
      id="settingsPanel"
    >
      <h2>교사용 문구 설정</h2>

      <div class="field">
        <label for="titleInput">
          메인 제목
        </label>

        <input
          id="titleInput"
          type="text"
        >
      </div>

      <div class="field">
        <label for="introInput">
          첫 번째 설명
        </label>

        <textarea id="introInput"></textarea>
      </div>

      <div class="field">
        <label for="predictTitleInput">
          활동 제목
        </label>

        <input
          id="predictTitleInput"
          type="text"
        >
      </div>

      <div class="field">
        <label for="predictTextInput">
          활동 설명
        </label>

        <textarea id="predictTextInput"></textarea>
      </div>

      <div class="field">
        <label for="buttonTextInput">
          시작 버튼 문구
        </label>

        <input
          id="buttonTextInput"
          type="text"
        >
      </div>

      <div class="settings-actions">
        <button
          type="button"
          onclick="saveSettings()"
        >
          저장하기
        </button>

        <button
          class="reset-button"
          type="button"
          onclick="resetSettings()"
        >
          기본값으로 되돌리기
        </button>
      </div>

      <div
        class="notice"
        id="saveNotice"
      >
        저장되었습니다.
      </div>
    </section>

    <section
      class="screen active"
      id="startScreen"
    >
      <h1 id="mainTitle">
        우주의 나이를 밝혀라
      </h1>

      <p id="mainIntro">
        실제 천문학 데이터를 활용하여
        우주의 나이를 추정하는 탐구 활동입니다.
      </p>

      <section class="card">
        <h2 id="predictTitle">
          예측하기
        </h2>

        <p id="predictText">
          우주의 나이는 약 몇 억 년일까요?
          자료를 분석하기 전에 먼저 예상해 봅시다.
        </p>

        <button
          id="startButton"
          type="button"
          onclick="showPredictionScreen()"
        >
          탐구 시작
        </button>
      </section>
    </section>

    <section
      class="screen"
      id="predictionScreen"
    >
      <h1>우주의 나이를 예측해 보세요</h1>

      <p>
        아직 자료를 보지 않은 상태에서
        자신의 생각과 가장 가까운 값을 선택하세요.
      </p>

      <section class="card">
        <div class="age-options">
          <button
            class="age-option"
            type="button"
            data-age="45"
            onclick="selectAge(this)"
          >
            <strong>45억 년</strong>
            <span>지구와 비슷한 나이</span>
          </button>

          <button
            class="age-option"
            type="button"
            data-age="90"
            onclick="selectAge(this)"
          >
            <strong>90억 년</strong>
            <span>지구 나이의 약 두 배</span>
          </button>

          <button
            class="age-option"
            type="button"
            data-age="138"
            onclick="selectAge(this)"
          >
            <strong>138억 년</strong>
            <span>현재 과학에서 제시하는 대표값</span>
          </button>

          <button
            class="age-option"
            type="button"
            data-age="300"
            onclick="selectAge(this)"
          >
            <strong>300억 년</strong>
            <span>매우 오래된 우주</span>
          </button>
        </div>

        <div
          class="result-box"
          id="predictionResult"
        ></div>

        <div class="action-area">
          <button
            class="back-button"
            type="button"
            onclick="showStartScreen()"
          >
            이전
          </button>

          <button
            id="nextButton"
            type="button"
            onclick="savePrediction()"
            disabled
          >
            선택 저장
          </button>
        </div>
      </section>
    </section>

    <section
      class="screen"
      id="completeScreen"
    >
      <h1>예측이 저장되었습니다</h1>

      <section class="card">
        <p id="savedPredictionText"></p>

        <p>
          다음 단계에서는 시간을 거꾸로 돌리며
          과거 우주의 모습을 관찰하게 됩니다.
        </p>

        <button
          type="button"
          onclick="showPredictionScreen()"
        >
          예측 다시 선택하기
        </button>
      </section>
    </section>

  </main>

  <script>
    const defaultSettings = {
      mainTitle: "우주의 나이를 밝혀라",

      mainIntro:
        "실제 천문학 데이터를 활용하여 우주의 나이를 추정하는 탐구 활동입니다.",

      predictTitle: "예측하기",

      predictText:
        "우주의 나이는 약 몇 억 년일까요? 자료를 분석하기 전에 먼저 예상해 봅시다.",

      buttonText: "탐구 시작"
    };

    let selectedAge = null;

    function loadSettings() {
      const savedSettings =
        localStorage.getItem("universeAgeSettings");

      if (savedSettings) {
        return JSON.parse(savedSettings);
      }

      return defaultSettings;
    }

    function applySettings(settings) {
      document.getElementById("mainTitle").textContent =
        settings.mainTitle;

      document.getElementById("mainIntro").textContent =
        settings.mainIntro;

      document.getElementById("predictTitle").textContent =
        settings.predictTitle;

      document.getElementById("predictText").textContent =
        settings.predictText;

      document.getElementById("startButton").textContent =
        settings.buttonText;

      document.getElementById("titleInput").value =
        settings.mainTitle;

      document.getElementById("introInput").value =
        settings.mainIntro;

      document.getElementById("predictTitleInput").value =
        settings.predictTitle;

      document.getElementById("predictTextInput").value =
        settings.predictText;

      document.getElementById("buttonTextInput").value =
        settings.buttonText;
    }

    function toggleSettings() {
      document
        .getElementById("settingsPanel")
        .classList
        .toggle("open");
    }

    function saveSettings() {
      const newSettings = {
        mainTitle:
          document.getElementById("titleInput").value,

        mainIntro:
          document.getElementById("introInput").value,

        predictTitle:
          document.getElementById("predictTitleInput").value,

        predictText:
          document.getElementById("predictTextInput").value,

        buttonText:
          document.getElementById("buttonTextInput").value
      };

      localStorage.setItem(
        "universeAgeSettings",
        JSON.stringify(newSettings)
      );

      applySettings(newSettings);

      const notice =
        document.getElementById("saveNotice");

      notice.style.display = "block";

      setTimeout(function () {
        notice.style.display = "none";
      }, 2000);
    }

    function resetSettings() {
      localStorage.removeItem(
        "universeAgeSettings"
      );

      applySettings(defaultSettings);
    }

    function hideAllScreens() {
      document
        .querySelectorAll(".screen")
        .forEach(function (screen) {
          screen.classList.remove("active");
        });
    }

    function showStartScreen() {
      hideAllScreens();

      document
        .getElementById("startScreen")
        .classList.add("active");
    }

    function showPredictionScreen() {
      hideAllScreens();

      document
        .getElementById("predictionScreen")
        .classList.add("active");
    }

    function selectAge(button) {
      document
        .querySelectorAll(".age-option")
        .forEach(function (option) {
          option.classList.remove("selected");
        });

      button.classList.add("selected");

      selectedAge =
        button.getAttribute("data-age");

      const result =
        document.getElementById("predictionResult");

      result.textContent =
        "선택한 예상값: " +
        selectedAge +
        "억 년";

      result.classList.add("show");

      document
        .getElementById("nextButton")
        .disabled = false;
    }

    function savePrediction() {
      if (!selectedAge) {
        return;
      }

      localStorage.setItem(
        "universeAgePrediction",
        selectedAge
      );

      document
        .getElementById("savedPredictionText")
        .textContent =
        "내가 예상한 우주의 나이: " +
        selectedAge +
        "억 년";

      hideAllScreens();

      document
        .getElementById("completeScreen")
        .classList.add("active");
    }

    const currentSettings = loadSettings();

    applySettings(currentSettings);

    const savedAge =
      localStorage.getItem(
        "universeAgePrediction"
      );

    if (savedAge) {
      selectedAge = savedAge;
    }
  </script>
</body>
</html>
