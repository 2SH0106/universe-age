<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>우주의 나이 탐구</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 18px;
      background:
        radial-gradient(circle at top, #18224f 0%, #080d22 45%);
      color: white;
      font-family:
        "Malgun Gothic",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .app-name {
      color: #aeb7e4;
      font-size: 14px;
      font-weight: bold;
    }

    h1 {
      color: #f0d082;
      line-height: 1.35;
    }

    h2,
    h3 {
      line-height: 1.4;
    }

    p {
      color: #c8cdea;
      line-height: 1.75;
    }

    button {
      padding: 11px 18px;
      background-color: #57d9a3;
      color: #08210f;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    input,
    textarea {
      font-size: 15px;
    }

    .teacher-button {
      background-color: #f0d082;
      color: #171b34;
    }

    .secondary-button {
      background-color: #35406f;
      color: white;
    }

    .danger-button {
      background-color: #ff8daa;
      color: #38121c;
    }

    .small-button {
      padding: 8px 12px;
      font-size: 13px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      margin-top: 22px;
      padding: 24px;
      background-color: rgba(19, 27, 65, 0.96);
      border: 1px solid #2a3468;
      border-radius: 16px;
    }

    .activity-list {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    .activity-card {
      padding: 22px;
      background-color: rgba(19, 27, 65, 0.96);
      border: 1px solid #2a3468;
      border-radius: 16px;
    }

    .activity-number {
      display: inline-block;
      margin-bottom: 8px;
      color: #57d9a3;
      font-size: 13px;
      font-weight: bold;
    }

    .activity-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .settings-panel {
      display: none;
      margin-bottom: 25px;
      padding: 22px;
      background-color: #111936;
      border: 1px solid #f0d082;
      border-radius: 16px;
    }

    .settings-panel.open {
      display: block;
    }

    .settings-description {
      margin-bottom: 20px;
      padding: 14px;
      background-color: #191f46;
      border-radius: 10px;
      color: #d7dcf4;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #f0d082;
      font-weight: bold;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px;
      background-color: #080d22;
      color: white;
      border: 1px solid #35406f;
      border-radius: 9px;
    }

    .field textarea {
      min-height: 85px;
      resize: vertical;
    }

    .teacher-activity-list {
      display: grid;
      gap: 18px;
      margin-top: 20px;
    }

    .teacher-activity-card {
      padding: 18px;
      background-color: #171f46;
      border: 1px solid #35406f;
      border-radius: 14px;
    }

    .teacher-activity-card h3 {
      margin-top: 0;
      color: #57d9a3;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 12px 0 16px;
    }

    .checkbox-row input {
      width: 19px;
      height: 19px;
    }

    .checkbox-row label {
      color: white;
      font-weight: bold;
    }

    .order-buttons,
    .settings-actions,
    .action-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .notice {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background-color: #11362d;
      border-radius: 9px;
      color: #79e7ba;
      font-weight: bold;
    }

    .age-options {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .age-option {
      padding: 18px;
      background-color: #111936;
      color: white;
      border: 1px solid #35406f;
      border-radius: 14px;
      text-align: left;
    }

    .age-option strong {
      display: block;
      margin-bottom: 6px;
      color: #f0d082;
      font-size: 20px;
    }

    .age-option span {
      color: #afb7df;
      font-size: 13px;
    }

    .age-option.selected {
      background-color: #183b49;
      border: 2px solid #5fd2e4;
    }

    .result-box {
      display: none;
      margin-top: 18px;
      padding: 15px;
      background-color: #102e28;
      border-left: 4px solid #57d9a3;
      border-radius: 10px;
      color: #d4f7e9;
    }

    .result-box.show {
      display: block;
    }

    .space-panel {
      margin-top: 20px;
      padding: 18px;
      background-color: #050816;
      border: 1px solid #344071;
      border-radius: 16px;
    }

    .space-stage {
      position: relative;
      width: 100%;
      height: 420px;
      overflow: hidden;
      background:
        radial-gradient(circle at center, #182758 0%, #070a19 55%, #02030a 100%);
      border-radius: 14px;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background-color: white;
      border-radius: 50%;
      opacity: 0.65;
    }

    .galaxy {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition:
        left 0.25s ease,
        top 0.25s ease,
        transform 0.25s ease;
    }

    .center-galaxy {
      left: 50%;
      top: 50%;
      width: 28px;
      height: 28px;
      background-color: #ffd95a;
      box-shadow:
        0 0 10px #ffd95a,
        0 0 24px rgba(255, 217, 90, 0.8);
      z-index: 5;
    }

    .outer-galaxy {
      width: 18px;
      height: 18px;
      background-color: #65c8ff;
      box-shadow:
        0 0 9px #65c8ff,
        0 0 20px rgba(101, 200, 255, 0.65);
    }

    .time-control {
      margin-top: 20px;
      padding: 18px;
      background-color: #111936;
      border-radius: 14px;
    }

    .time-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: #dce2ff;
      font-weight: bold;
    }

    .time-value {
      color: #57d9a3;
    }

    .time-slider {
      width: 100%;
      accent-color: #57d9a3;
    }

    .legend {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .legend-item {
      padding: 14px;
      background-color: #111936;
      border-radius: 12px;
      color: #d8def7;
      line-height: 1.6;
    }

    .legend-dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      border-radius: 50%;
      vertical-align: -2px;
    }

    .yellow-dot {
      background-color: #ffd95a;
      box-shadow: 0 0 8px #ffd95a;
    }

    .blue-dot {
      background-color: #65c8ff;
      box-shadow: 0 0 8px #65c8ff;
    }

    .question-box {
      margin-top: 22px;
      padding: 20px;
      background-color: #171f46;
      border-radius: 14px;
    }

    .student-answer {
      width: 100%;
      min-height: 110px;
      margin-top: 10px;
      padding: 13px;
      background-color: #080d22;
      color: white;
      border: 1px solid #46558f;
      border-radius: 10px;
      resize: vertical;
    }

    .saved-answer {
      display: none;
      margin-top: 12px;
      color: #79e7ba;
      font-weight: bold;
    }

    .saved-answer.show {
      display: block;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }

      .space-stage {
        height: 340px;
      }

      .card,
      .activity-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="top-bar">
      <div class="app-name">
        우주의 나이 탐구 웹앱
      </div>

      <button
        class="teacher-button"
        type="button"
        onclick="toggleTeacherPanel()"
      >
        ⚙ 교사용 편집
      </button>
    </div>

    <section
      class="settings-panel"
      id="teacherPanel"
    >
      <h2>교사용 활동 편집</h2>

      <div class="settings-description">
        학생용 화면은 그대로 유지됩니다.
        이곳에서 활동 제목, 설명, 질문, 안내 문구를 수정할 수 있습니다.
      </div>

      <div class="field">
        <label for="mainTitleInput">
          웹앱 메인 제목
        </label>

        <input id="mainTitleInput" type="text">
      </div>

      <div class="field">
        <label for="mainIntroInput">
          웹앱 안내 문구
        </label>

        <textarea id="mainIntroInput"></textarea>
      </div>

      <div
        class="teacher-activity-list"
        id="teacherActivityList"
      ></div>

      <section class="teacher-activity-card">
        <h3>시간 역행 활동 상세 설정</h3>

        <div class="field">
          <label for="yellowDescriptionInput">
            노란색 점 설명
          </label>

          <textarea id="yellowDescriptionInput"></textarea>
        </div>

        <div class="field">
          <label for="blueDescriptionInput">
            파란색 점 설명
          </label>

          <textarea id="blueDescriptionInput"></textarea>
        </div>

        <div class="field">
          <label for="observationGuideInput">
            관찰 안내 문구
          </label>

          <textarea id="observationGuideInput"></textarea>
        </div>

        <div class="field">
          <label for="reverseQuestionInput">
            학생 질문
          </label>

          <textarea id="reverseQuestionInput"></textarea>
        </div>

        <div class="field">
          <label for="answerPlaceholderInput">
            답변 입력 예시
          </label>

          <input
            id="answerPlaceholderInput"
            type="text"
          >
        </div>
      </section>

      <div class="settings-actions">
        <button
          type="button"
          onclick="saveTeacherSettings()"
        >
          변경 내용 저장
        </button>

        <button
          class="danger-button"
          type="button"
          onclick="resetTeacherSettings()"
        >
          모두 기본값으로 되돌리기
        </button>
      </div>

      <div class="notice" id="saveNotice">
        변경 내용이 저장되었습니다.
      </div>
    </section>

    <section
      class="screen active"
      id="homeScreen"
    >
      <h1 id="mainTitle"></h1>

      <p id="mainIntro"></p>

      <section class="card">
        <h2>탐구 활동 목록</h2>

        <p>
          아래 활동을 순서대로 진행하며
          우주의 나이를 추정해 봅시다.
        </p>
      </section>

      <div
        class="activity-list"
        id="studentActivityList"
      ></div>
    </section>

    <section
      class="screen"
      id="predictionScreen"
    >
      <h1 id="predictionPageTitle"></h1>

      <p id="predictionPageDescription"></p>

      <section class="card">
        <div class="age-options">
          <button
            class="age-option"
            type="button"
            data-age="45"
            onclick="selectAge(this)"
          >
            <strong>45억 년</strong>
            <span>지구와 비슷한 나이</span>
          </button>

          <button
            class="age-option"
            type="button"
            data-age="90"
            onclick="selectAge(this)"
          >
            <strong>90억 년</strong>
            <span>지구 나이의 약 두 배</span>
          </button>

          <button
            class="age-option"
            type="button"
            data-age="138"
            onclick="selectAge(this)"
          >
            <strong>138억 년</strong>
            <span>현재 과학에서 제시하는 대표값</span>
          </button>

          <button
            class="age-option"
            type="button"
            data-age="300"
            onclick="selectAge(this)"
          >
            <strong>300억 년</strong>
            <span>매우 오래된 우주</span>
          </button>
        </div>

        <div
          class="result-box"
          id="predictionResult"
        ></div>

        <div class="action-area">
          <button
            class="secondary-button"
            type="button"
            onclick="showHomeScreen()"
          >
            활동 목록
          </button>

          <button
            id="savePredictionButton"
            type="button"
            onclick="savePrediction()"
            disabled
          >
            선택 저장
          </button>
        </div>
      </section>
    </section>

    <section
      class="screen"
      id="reverseTimeScreen"
    >
      <h1 id="reversePageTitle"></h1>

      <p id="reversePageDescription"></p>

      <section class="card">
        <p id="observationGuide"></p>

        <div class="space-panel">
          <div
            class="space-stage"
            id="spaceStage"
          >
            <div
              class="galaxy center-galaxy"
              aria-label="기준 은하"
            ></div>
          </div>
        </div>

        <div class="time-label">
  <span>현재의 우주</span>

  <span
    class="time-value"
    id="timeValue"
  >
    현재
  </span>
</div>

<div
  style="
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    color:#9fa9d7;
    font-size:13px;
  "
>
  <span>현재</span>
  <span>더 먼 과거</span>
</div>

          <input
            class="time-slider"
            id="timeSlider"
            type="range"
            min="0"
            max="100"
            value="0"
            oninput="updateUniverse()"
          >

          <p>
            슬라이더를 오른쪽으로 움직일수록
            더 먼 과거의 우주를 나타냅니다.
          </p>
        </div>

        <div class="legend">
          <div class="legend-item">
            <span
              class="legend-dot yellow-dot"
            ></span>

            <span id="yellowDescription"></span>
          </div>

          <div class="legend-item">
            <span
              class="legend-dot blue-dot"
            ></span>

            <span id="blueDescription"></span>
          </div>
        </div>

        <div class="question-box">
          <h2>관찰 결과 기록</h2>

          <p id="reverseQuestion"></p>

          <textarea
            class="student-answer"
            id="reverseAnswer"
          ></textarea>

          <div class="action-area">
            <button
              class="secondary-button"
              type="button"
              onclick="showHomeScreen()"
            >
              활동 목록
            </button>

            <button
              type="button"
              onclick="saveReverseAnswer()"
            >
              답변 저장
            </button>
          </div>

          <div
            class="saved-answer"
            id="reverseAnswerNotice"
          >
            답변이 저장되었습니다.
          </div>
        </div>
      </section>
    </section>

  </main>

  <script>
    const defaultData = {
      mainTitle: "MISSION: 우주의 나이를 밝혀라",

      mainIntro:
        "실제 천문학적 개념과 자료를 활용하여 우주의 팽창을 이해하고 우주의 나이를 추정하는 탐구 활동입니다.",

      activities: [
        {
          id: "prediction",
          title: "우주의 나이 예측하기",
          description:
            "자료를 확인하기 전에 우주의 나이가 얼마나 될지 자신의 생각을 선택합니다.",
          visible: true
        },
        {
          id: "reverseTime",
          title: "시간을 거꾸로 돌려보기",
          description:
            "팽창하는 우주의 시간을 거꾸로 돌리며 과거 은하 사이의 거리 변화를 관찰합니다.",
          visible: true
        }
      ],

      reverseTimeSettings: {
        yellowDescription:
          "노란색 점은 관찰의 기준이 되는 우리 은하를 나타냅니다.",

        blueDescription:
          "파란색 점은 우리 은하에서 멀어지는 다른 은하들을 나타냅니다.",

        observationGuide:
          "시간 슬라이더를 움직여 과거로 갈수록 은하 사이의 거리가 어떻게 달라지는지 관찰하세요.",

        question:
          "시간을 과거로 돌릴수록 은하 사이의 거리는 어떻게 변했나요? 이 관찰을 통해 초기 우주의 모습은 어떠했을지 설명해 보세요.",

        answerPlaceholder:
          "예: 과거로 갈수록 은하 사이의 거리가..."
      }
    };

    let appData = loadAppData();
    let selectedAge = null;

    const galaxyPositions = [
      { x: 18, y: 22 },
      { x: 37, y: 18 },
      { x: 67, y: 20 },
      { x: 82, y: 30 },
      { x: 20, y: 58 },
      { x: 35, y: 75 },
      { x: 68, y: 72 },
      { x: 84, y: 60 }
    ];

    function cloneDefaultData() {
      return JSON.parse(
        JSON.stringify(defaultData)
      );
    }

    function loadAppData() {
      const savedData =
        localStorage.getItem(
          "universeAgeAppData"
        );

      if (!savedData) {
        return cloneDefaultData();
      }

      try {
        const parsedData =
          JSON.parse(savedData);

        const mergedData =
          cloneDefaultData();

        if (parsedData.mainTitle) {
          mergedData.mainTitle =
            parsedData.mainTitle;
        }

        if (parsedData.mainIntro) {
          mergedData.mainIntro =
            parsedData.mainIntro;
        }

        if (
          Array.isArray(
            parsedData.activities
          )
        ) {
          mergedData.activities =
            parsedData.activities;
        }

        if (
          parsedData.reverseTimeSettings
        ) {
          mergedData.reverseTimeSettings = {
            ...mergedData.reverseTimeSettings,
            ...parsedData.reverseTimeSettings
          };
        }

        return mergedData;
      } catch (error) {
        return cloneDefaultData();
      }
    }

    function saveAppData() {
      localStorage.setItem(
        "universeAgeAppData",
        JSON.stringify(appData)
      );
    }

    function toggleTeacherPanel() {
      document
        .getElementById("teacherPanel")
        .classList
        .toggle("open");
    }

    function renderAll() {
      renderMainText();
      renderStudentActivities();
      renderTeacherActivities();
      renderReverseTimeSettings();
      updateActivityPages();
    }

    function renderMainText() {
      document
        .getElementById("mainTitle")
        .textContent = appData.mainTitle;

      document
        .getElementById("mainIntro")
        .textContent = appData.mainIntro;

      document
        .getElementById("mainTitleInput")
        .value = appData.mainTitle;

      document
        .getElementById("mainIntroInput")
        .value = appData.mainIntro;
    }

    function renderStudentActivities() {
      const list =
        document.getElementById(
          "studentActivityList"
        );

      list.innerHTML = "";

      const visibleActivities =
        appData.activities.filter(
          function (activity) {
            return activity.visible;
          }
        );

      if (visibleActivities.length === 0) {
        list.innerHTML = `
          <div class="card">
            현재 학생에게 공개된 활동이 없습니다.
          </div>
        `;

        return;
      }

      visibleActivities.forEach(
        function (activity, index) {
          const card =
            document.createElement("section");

          card.className =
            "activity-card";

          card.innerHTML = `
            <span class="activity-number">
              ACTIVITY ${index + 1}
            </span>

            <h2>
              ${escapeHtml(activity.title)}
            </h2>

            <p>
              ${escapeHtml(activity.description)}
            </p>

            <button
              type="button"
              onclick="openActivity('${activity.id}')"
            >
              활동 시작
            </button>
          `;

          list.appendChild(card);
        }
      );
    }

    function renderTeacherActivities() {
      const list =
        document.getElementById(
          "teacherActivityList"
        );

      list.innerHTML = "";

      appData.activities.forEach(
        function (activity, index) {
          const card =
            document.createElement("section");

          card.className =
            "teacher-activity-card";

          card.innerHTML = `
            <h3>
              활동 ${index + 1}
            </h3>

            <div class="field">
              <label>
                활동 제목
              </label>

              <input
                id="activityTitle${index}"
                type="text"
                value="${escapeAttribute(activity.title)}"
              >
            </div>

            <div class="field">
              <label>
                활동 설명
              </label>

              <textarea
                id="activityDescription${index}"
              >${escapeHtml(activity.description)}</textarea>
            </div>

            <div class="checkbox-row">
              <input
                id="activityVisible${index}"
                type="checkbox"
                ${activity.visible ? "checked" : ""}
              >

              <label
                for="activityVisible${index}"
              >
                학생 화면에 이 활동 보이기
              </label>
            </div>

            <div class="order-buttons">
              <button
                class="secondary-button small-button"
                type="button"
                onclick="moveActivity(${index}, -1)"
                ${index === 0 ? "disabled" : ""}
              >
                ▲ 위로 이동
              </button>

              <button
                class="secondary-button small-button"
                type="button"
                onclick="moveActivity(${index}, 1)"
                ${
                  index ===
                  appData.activities.length - 1
                    ? "disabled"
                    : ""
                }
              >
                ▼ 아래로 이동
              </button>
            </div>
          `;

          list.appendChild(card);
        }
      );
    }

    function renderReverseTimeSettings() {
      const settings =
        appData.reverseTimeSettings;

      document
        .getElementById(
          "yellowDescriptionInput"
        )
        .value =
        settings.yellowDescription;

      document
        .getElementById(
          "blueDescriptionInput"
        )
        .value =
        settings.blueDescription;

      document
        .getElementById(
          "observationGuideInput"
        )
        .value =
        settings.observationGuide;

      document
        .getElementById(
          "reverseQuestionInput"
        )
        .value =
        settings.question;

      document
        .getElementById(
          "answerPlaceholderInput"
        )
        .value =
        settings.answerPlaceholder;

      document
        .getElementById(
          "yellowDescription"
        )
        .textContent =
        settings.yellowDescription;

      document
        .getElementById(
          "blueDescription"
        )
        .textContent =
        settings.blueDescription;

      document
        .getElementById(
          "observationGuide"
        )
        .textContent =
        settings.observationGuide;

      document
        .getElementById(
          "reverseQuestion"
        )
        .textContent =
        settings.question;

      document
        .getElementById(
          "reverseAnswer"
        )
        .placeholder =
        settings.answerPlaceholder;
    }

    function collectTeacherInputs() {
      appData.mainTitle =
        document
          .getElementById("mainTitleInput")
          .value
          .trim();

      appData.mainIntro =
        document
          .getElementById("mainIntroInput")
          .value
          .trim();

      appData.activities.forEach(
        function (activity, index) {
          activity.title =
            document
              .getElementById(
                "activityTitle" + index
              )
              .value
              .trim();

          activity.description =
            document
              .getElementById(
                "activityDescription" + index
              )
              .value
              .trim();

          activity.visible =
            document
              .getElementById(
                "activityVisible" + index
              )
              .checked;
        }
      );

      appData.reverseTimeSettings = {
        yellowDescription:
          document
            .getElementById(
              "yellowDescriptionInput"
            )
            .value
            .trim(),

        blueDescription:
          document
            .getElementById(
              "blueDescriptionInput"
            )
            .value
            .trim(),

        observationGuide:
          document
            .getElementById(
              "observationGuideInput"
            )
            .value
            .trim(),

        question:
          document
            .getElementById(
              "reverseQuestionInput"
            )
            .value
            .trim(),

        answerPlaceholder:
          document
            .getElementById(
              "answerPlaceholderInput"
            )
            .value
            .trim()
      };
    }

    function saveTeacherSettings() {
      collectTeacherInputs();
      saveAppData();
      renderAll();

      const notice =
        document.getElementById(
          "saveNotice"
        );

      notice.style.display = "block";

      setTimeout(function () {
        notice.style.display = "none";
      }, 2000);
    }

    function resetTeacherSettings() {
      const confirmed = confirm(
        "교사용 편집 내용을 모두 기본값으로 되돌릴까요?"
      );

      if (!confirmed) {
        return;
      }

      localStorage.removeItem(
        "universeAgeAppData"
      );

      appData = cloneDefaultData();

      renderAll();
      createGalaxies();
      updateUniverse();
    }

    function moveActivity(
      currentIndex,
      direction
    ) {
      collectTeacherInputs();

      const newIndex =
        currentIndex + direction;

      if (
        newIndex < 0 ||
        newIndex >= appData.activities.length
      ) {
        return;
      }

      const movedActivity =
        appData.activities.splice(
          currentIndex,
          1
        )[0];

      appData.activities.splice(
        newIndex,
        0,
        movedActivity
      );

      saveAppData();
      renderAll();
    }

    function updateActivityPages() {
      const predictionActivity =
        appData.activities.find(
          function (activity) {
            return activity.id ===
              "prediction";
          }
        );

      const reverseTimeActivity =
        appData.activities.find(
          function (activity) {
            return activity.id ===
              "reverseTime";
          }
        );

      if (predictionActivity) {
        document
          .getElementById(
            "predictionPageTitle"
          )
          .textContent =
          predictionActivity.title;

        document
          .getElementById(
            "predictionPageDescription"
          )
          .textContent =
          predictionActivity.description;
      }

      if (reverseTimeActivity) {
        document
          .getElementById(
            "reversePageTitle"
          )
          .textContent =
          reverseTimeActivity.title;

        document
          .getElementById(
            "reversePageDescription"
          )
          .textContent =
          reverseTimeActivity.description;
      }
    }

    function hideAllScreens() {
      document
        .querySelectorAll(".screen")
        .forEach(function (screen) {
          screen.classList.remove(
            "active"
          );
        });
    }

    function showHomeScreen() {
      hideAllScreens();

      document
        .getElementById("homeScreen")
        .classList
        .add("active");

      window.scrollTo(0, 0);
    }

    function openActivity(activityId) {
      hideAllScreens();

      if (activityId === "prediction") {
        document
          .getElementById(
            "predictionScreen"
          )
          .classList
          .add("active");
      }

      if (activityId === "reverseTime") {
        document
          .getElementById(
            "reverseTimeScreen"
          )
          .classList
          .add("active");

        updateUniverse();
      }

      window.scrollTo(0, 0);
    }

    function selectAge(button) {
      document
        .querySelectorAll(".age-option")
        .forEach(function (option) {
          option.classList.remove(
            "selected"
          );
        });

      button.classList.add("selected");

      selectedAge =
        button.getAttribute("data-age");

      const result =
        document.getElementById(
          "predictionResult"
        );

      result.textContent =
        "내가 예상한 우주의 나이: " +
        selectedAge +
        "억 년";

      result.classList.add("show");

      document
        .getElementById(
          "savePredictionButton"
        )
        .disabled = false;
    }

    function savePrediction() {
      if (!selectedAge) {
        return;
      }

      localStorage.setItem(
        "universeAgePrediction",
        selectedAge
      );

      alert(
        selectedAge +
        "억 년으로 예측을 저장했습니다."
      );
    }

    function createStars() {
      const stage =
        document.getElementById(
          "spaceStage"
        );

      for (let i = 0; i < 70; i++) {
        const star =
          document.createElement("div");

        star.className = "star";
        star.style.left =
          Math.random() * 100 + "%";
        star.style.top =
          Math.random() * 100 + "%";
        star.style.opacity =
          0.25 + Math.random() * 0.65;

        stage.appendChild(star);
      }
    }

    function createGalaxies() {
      const stage =
        document.getElementById(
          "spaceStage"
        );

      stage
        .querySelectorAll(
          ".outer-galaxy"
        )
        .forEach(function (galaxy) {
          galaxy.remove();
        });

      galaxyPositions.forEach(
        function (position, index) {
          const galaxy =
            document.createElement("div");

          galaxy.className =
            "galaxy outer-galaxy";

          galaxy.dataset.index = index;

          stage.appendChild(galaxy);
        }
      );
    }

    function updateUniverse() {
      const slider =
        document.getElementById(
          "timeSlider"
        );

      const pastAmount =
        Number(slider.value) / 100;

      const contraction =
        1 - pastAmount * 0.78;

      document
        .getElementById("timeValue")
        .textContent =
        slider.value === "0"
          ? "현재"
          : slider.value +
            "% 과거";

      document
        .querySelectorAll(
          ".outer-galaxy"
        )
        .forEach(function (galaxy) {
          const index =
            Number(
              galaxy.dataset.index
            );

          const original =
            galaxyPositions[index];

          const newX =
            50 +
            (original.x - 50) *
            contraction;

          const newY =
            50 +
            (original.y - 50) *
            contraction;

          galaxy.style.left =
            newX + "%";

          galaxy.style.top =
            newY + "%";

          const scale =
            0.7 +
            contraction * 0.3;

          galaxy.style.transform =
            "translate(-50%, -50%) " +
            "scale(" + scale + ")";
        });
    }

    function saveReverseAnswer() {
      const answer =
        document
          .getElementById(
            "reverseAnswer"
          )
          .value
          .trim();

      if (!answer) {
        alert(
          "관찰 결과를 먼저 입력해 주세요."
        );

        return;
      }

      localStorage.setItem(
        "universeAgeReverseAnswer",
        answer
      );

      const notice =
        document.getElementById(
          "reverseAnswerNotice"
        );

      notice.classList.add("show");

      setTimeout(function () {
        notice.classList.remove("show");
      }, 2200);
    }

    function loadStudentAnswers() {
      const savedAnswer =
        localStorage.getItem(
          "universeAgeReverseAnswer"
        );

      if (savedAnswer) {
        document
          .getElementById(
            "reverseAnswer"
          )
          .value = savedAnswer;
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(text) {
      return escapeHtml(text);
    }

    renderAll();
    createStars();
    createGalaxies();
    updateUniverse();
    loadStudentAnswers();
  </script>
</body>
</html>
